version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app

  # ROSphere CLI container for development
  rosphere-cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    profiles:
      - cli

networks:
  default:
    driver: bridge